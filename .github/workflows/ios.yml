# Compila la app para iPhone en una Mac de GitHub y publica TVMundial.ipa
# en la sección "Releases" del repositorio (etiqueta ios-latest).
# El .ipa sale SIN firmar: se instala con Sideloadly o AltStore usando tu Apple ID.
name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.403'

      # Xcode 26.5 coincide con el SDK de iOS 26.5; si no está, se usa el Xcode predeterminado.
      - name: Seleccionar Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=/Applications/Xcode.app
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch
          xcrun --sdk macosx --show-sdk-path || true
          xcrun --sdk iphoneos --show-sdk-path || true
          # actool necesita la plataforma de iOS instalada (en Xcode 26 se descarga aparte).
          if ! xcrun simctl list runtimes | grep -q "iOS"; then
            sudo xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes

      # 10.0.401 trae el SDK de iOS 26.5, que coincide con el Xcode de las Mac de GitHub.
      # (Las versiones más nuevas piden Xcode 27.1, que aún no está disponible ahí.)
      - name: Instalar MAUI para iOS
        run: dotnet workload install maui-ios --version 10.0.401

      - name: Compilar
        run: |
          dotnet build AplicacionTV.csproj -f net10.0-ios -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:MauiVersion=10.0.110 \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ValidateXcodeVersion=false 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            dotnet workload list
            grep -iE "error|xcode" build.log | sort -u | head -30 | sed 's/^/::error::/'
          fi
          exit $STATUS

      - name: Empaquetar .ipa
        run: |
          APP=$(find bin/Release/net10.0-ios/ios-arm64 -maxdepth 2 -name "*.app" -type d | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TVMundial.ipa Payload
          ls -lh TVMundial.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TVMundial-ipa
          path: TVMundial.ipa

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest TVMundial.ipa \
            --title "TV Mundial para iPhone (última versión)" \
            --notes "Archivo .ipa sin firmar. Instálalo con Sideloadly o AltStore usando tu Apple ID. Ver README." \
            --target "${{ github.sha }}"
