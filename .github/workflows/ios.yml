# Compila la app para iPhone en una Mac de GitHub y publica TVMundial.ipa
# en la sección "Releases" del repositorio (etiqueta ios-latest).
# El .ipa sale SIN firmar: se instala con Sideloadly o AltStore usando tu Apple ID.
name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Seleccionar el Xcode más reciente
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Instalar MAUI para iOS
        run: dotnet workload install maui-ios

      - name: Compilar
        run: |
          dotnet build AplicacionTV.csproj -f net10.0-ios -c Release \
            -p:TargetFrameworks=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:ValidateXcodeVersion=false

      - name: Empaquetar .ipa
        run: |
          APP=$(find bin/Release/net10.0-ios/ios-arm64 -maxdepth 2 -name "*.app" -type d | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TVMundial.ipa Payload
          ls -lh TVMundial.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: TVMundial-ipa
          path: TVMundial.ipa

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest TVMundial.ipa \
            --title "TV Mundial para iPhone (última versión)" \
            --notes "Archivo .ipa sin firmar. Instálalo con Sideloadly o AltStore usando tu Apple ID. Ver README." \
            --target "${{ github.sha }}"
